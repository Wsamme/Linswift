<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linswift Capture Indicator</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
        font-family: "SF Pro Display", "PingFang SC", sans-serif;
      }
      .frame {
        position: fixed;
        display: none;
        border-radius: 24px;
        border: 3px solid #ff7f4b;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.42),
          0 18px 36px rgba(25, 14, 9, 0.18);
      }
      .tag {
        position: absolute;
        top: -16px;
        left: 14px;
        display: inline-flex;
        align-items: center;
        height: 30px;
        padding: 0 14px;
        border-radius: 999px;
        background: linear-gradient(180deg, #ff8d57, #ff7646);
        color: #fff8f1;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.03em;
        box-shadow: 0 10px 24px rgba(255, 123, 68, 0.28);
      }
      .status {
        position: absolute;
        left: 16px;
        bottom: -18px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        background: rgba(54, 57, 63, 0.94);
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 14px 30px rgba(18, 12, 9, 0.24);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #ff9b4c;
        box-shadow: 0 0 10px rgba(255, 155, 76, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="frame" id="frame">
      <div class="tag">OCR 识别区域</div>
      <div class="status"><span class="dot"></span><span id="status">OCR 识别中…</span></div>
    </div>
    <script>
      const frame = document.getElementById('frame')
      const statusNode = document.getElementById('status')

      window.captureIndicatorBridge?.onData?.((payload) => {
        const rect = payload?.selectionRect
        const display = payload?.displayBounds || { x: 0, y: 0 }
        if (!rect) {
          frame.style.display = 'none'
          return
        }
        frame.style.display = 'block'
        frame.style.left = `${rect.x - display.x}px`
        frame.style.top = `${rect.y - display.y}px`
        frame.style.width = `${rect.width}px`
        frame.style.height = `${rect.height}px`
        statusNode.textContent = payload?.status || 'OCR 识别中…'
      })
    </script>
  </body>
</html>
